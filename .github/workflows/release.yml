name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # L'updater in-app compare le tag à la version installée : un tag qui ne
      # correspond pas au pubspec produirait une boucle de MAJ ou un APK menteur.
      - name: Vérifier tag = version pubspec
        run: |
          PUBSPEC_VERSION=$(sed -n 's/^version: \([0-9][0-9.]*\)+.*/\1/p' pubspec.yaml)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME ≠ version pubspec $PUBSPEC_VERSION" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Reconstituer le keystore de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - run: flutter build apk --release

      - name: Préparer l'asset
        run: cp build/app/outputs/flutter-apk/app-release.apk "seedlux-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          name: Seedlux ${{ github.ref_name }}
          generate_release_notes: true
          files: seedlux-*.apk
